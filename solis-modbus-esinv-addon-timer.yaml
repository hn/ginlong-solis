text:
  - platform: template
    name: "Timed Charge 1"
    id: timed_charge_1
    # optimistic so the state updates immediately on set: charge and discharge
    # share one register block and each write preserves the other half from its
    # entity state, so back-to-back writes must see fresh values. The periodic
    # read (above) re-syncs the state from the inverter.
    optimistic: true
    mode: TEXT
    setup_priority: -100
    set_action:
      then:
        - lambda: |-
            ESP_LOGI("WLambda1", "Write Lambda entry: '%s'", x.c_str());
            // New value is in the "x" variable
            unsigned int s_hours, s_mins, e_hours, e_mins;
            if (sscanf(x.c_str(), "%02u:%02u-%02u:%02u", &s_hours, &s_mins, &e_hours, &e_mins) != 4) {
              ESP_LOGI("WLambda1", "Bad format");
              return;
            }
            ESP_LOGI("WLambda1", "Write Lambda %02u:%02u to %02u:%02u", s_hours, s_mins, e_hours, e_mins);

            if ((s_hours < 0) || (s_hours > 23) || (s_mins < 0) || (s_mins > 59) ||
                (e_hours < 0) || (e_hours > 23) || (e_mins < 0) || (e_mins > 59))
            {
              ESP_LOGI("WLambda1", "Values out of bounds");
              return;
            }

            // Preserve the discharge half (registers +4..+7) from its entity
            // state; falls back to 00:00-00:00 if it has not been populated
            // from the inverter yet (e.g. right after boot).
            unsigned int d_s_hours = 0, d_s_mins = 0, d_e_hours = 0, d_e_mins = 0;
            if (sscanf(id(timed_discharge_1).state.c_str(), "%02u:%02u-%02u:%02u",
                       &d_s_hours, &d_s_mins, &d_e_hours, &d_e_mins) != 4) {
              ESP_LOGW("WLambda1", "Timed Discharge 1 state unknown, writing 00:00-00:00 for discharge half");
              d_s_hours = 0; d_s_mins = 0; d_e_hours = 0; d_e_mins = 0;
            }

            esphome::modbus_controller::ModbusController *controller = id(modbus_master);

            // create the payload
            std::vector<uint16_t> payload = {
              (uint16_t)s_hours, (uint16_t)s_mins,
              (uint16_t)e_hours, (uint16_t)e_mins,
              (uint16_t)d_s_hours, (uint16_t)d_s_mins,
              (uint16_t)d_e_hours, (uint16_t)d_e_mins
              };

            // Create a modbus command item with the time information as the payload
            esphome::modbus_controller::ModbusCommandItem set_timer_command =
                esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 43143, 8, payload);
            // Submit the command to the send queue
            controller->queue_command(set_timer_command);
            ESP_LOGI("WLambda1", "Timer1 set to %02u:%02u - %02u:%02u", s_hours, s_mins, e_hours, e_mins);

  - platform: template
    name: "Timed Discharge 1"
    id: timed_discharge_1
    optimistic: true
    mode: TEXT
    setup_priority: -100
    set_action:
      then:
        - lambda: |-
            ESP_LOGI("WLambda1d", "Write Lambda entry: '%s'", x.c_str());
            // New value is in the "x" variable
            unsigned int s_hours, s_mins, e_hours, e_mins;
            if (sscanf(x.c_str(), "%02u:%02u-%02u:%02u", &s_hours, &s_mins, &e_hours, &e_mins) != 4) {
              ESP_LOGI("WLambda1d", "Bad format");
              return;
            }
            ESP_LOGI("WLambda1d", "Write Lambda %02u:%02u to %02u:%02u", s_hours, s_mins, e_hours, e_mins);

            if ((s_hours < 0) || (s_hours > 23) || (s_mins < 0) || (s_mins > 59) ||
                (e_hours < 0) || (e_hours > 23) || (e_mins < 0) || (e_mins > 59))
            {
              ESP_LOGI("WLambda1d", "Values out of bounds");
              return;
            }

            // Preserve the charge half (registers +0..+3) from its entity
            // state; falls back to 00:00-00:00 if it has not been populated
            // from the inverter yet (e.g. right after boot).
            unsigned int c_s_hours = 0, c_s_mins = 0, c_e_hours = 0, c_e_mins = 0;
            if (sscanf(id(timed_charge_1).state.c_str(), "%02u:%02u-%02u:%02u",
                       &c_s_hours, &c_s_mins, &c_e_hours, &c_e_mins) != 4) {
              ESP_LOGW("WLambda1d", "Timed Charge 1 state unknown, writing 00:00-00:00 for charge half");
              c_s_hours = 0; c_s_mins = 0; c_e_hours = 0; c_e_mins = 0;
            }

            esphome::modbus_controller::ModbusController *controller = id(modbus_master);

            // create the payload
            std::vector<uint16_t> payload = {
              (uint16_t)c_s_hours, (uint16_t)c_s_mins,
              (uint16_t)c_e_hours, (uint16_t)c_e_mins,
              (uint16_t)s_hours, (uint16_t)s_mins,
              (uint16_t)e_hours, (uint16_t)e_mins
              };

            // Create a modbus command item with the time information as the payload
            esphome::modbus_controller::ModbusCommandItem set_timer_command =
                esphome::modbus_controller::ModbusCommandItem::create_write_multiple_command(controller, 43143, 8, payload);
            // Submit the command to the send queue
            controller->queue_command(set_timer_command);
            ESP_LOGI("WLambda1d", "Timer1 discharge set to %02u:%02u - %02u:%02u", s_hours, s_mins, e_hours, e_mins);

